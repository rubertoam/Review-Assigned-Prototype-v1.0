# Builds the Vite app and publishes to the gh-pages branch.
# Repo → Settings → Pages → Build and deployment → Source: Deploy from a branch
# Branch: gh-pages / folder: / (root)

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout ACE Design System (local @ace-ds alias)
        run: |
          DS_ROOT="${GITHUB_WORKSPACE}/../../Design System/Design System Sandbox"
          mkdir -p "$(dirname "$DS_ROOT")"
          git clone --depth 1 https://github.com/rubertoam/ACEDesignSystem.git "$DS_ROOT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
